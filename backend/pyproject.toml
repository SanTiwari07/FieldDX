[project]
name = "fielddx-backend"
version = "0.1.0"
description = "FieldDx: differential diagnosis for farm fields (API and engine)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
